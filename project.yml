name: DriveLog
options:
  bundleIdPrefix: pl.drivelog
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
targets:
  DriveLog:
    type: application
    platform: iOS
    sources: [DriveLog]
    attributes:
      SystemCapabilities:
        com.apple.BackgroundModes:
          enabled: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.drivelog.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DriveLog
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: DriveLog używa lokalizacji do zapisu trasy, dystansu i czasu przejazdu.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: DriveLog może rejestrować rozpoczętą trasę również po wygaszeniu ekranu.
        INFOPLIST_KEY_UIBackgroundModes: [location]
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.5.3
        CURRENT_PROJECT_VERSION: 10
  DriveLogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DriveLogTests]
    dependencies:
      - target: DriveLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DriveLog:
    build:
      targets:
        DriveLog: all
    test:
      targets:
        - DriveLogTests
